# Render blueprint — deploys Myna as a web service with PostgreSQL.
# Free-plan friendly: no persistent disk needed (SQLite is fine for a free tier).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: myna
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myna-db
          property: connectionString
      # ---- Set these in the Render dashboard (Environment tab) after deploy ----
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: myna-db
    plan: free
    databaseName: myna
    user: myna
