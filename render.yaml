# Render blueprint — Myna: a JSON API, a web front end, and PostgreSQL.
# Free-plan friendly: no persistent disk needed.
# Docs: https://render.com/docs/blueprint-spec
#
#   myna       FastAPI. JSON only — /api/* and /docs. It serves no HTML and no
#              assets; hitting / returns a small JSON pointer, not a page.
#   myna-app   The web front end: app/static published to a static host, so the
#              browser isn't stuck behind the free backend's ~30 s cold start.
#
# The split is the architecture, not a deployment detail. The backend has no
# idea what a client looks like; the web app, a future mobile app, and anything
# else all reach it the same way, over REST. Nothing is server-rendered and
# nothing is shared between the two but the endpoint contract.
#
# ---------------------------------------------------------------------------
# What went wrong last time, and what stops it now
# ---------------------------------------------------------------------------
# Splitting the deploy is fine. Letting the two halves drift apart is not, and
# that is what actually broke:
#
#   1. The front end served older HTML than the backend was running, so the app
#      looked un-deployed while the deploy had in fact succeeded.
#      -> autoDeploy is explicit on both. One push, both services, same commit.
#
#   2. The backend URL pointed somewhere wrong, which breaks every request
#      while both services still report healthy.
#      -> the front end no longer stores that URL at all: Render resolves it
#         from the backend service. And if it is ever wrong anyway, the app
#         probes /api/food/health on failure and names the address it is
#         calling, instead of telling the user to check their connection.
#
#   3. /docs and /api/* 404 on the static host.
#      -> expected, not a bug: a static host has neither. Both live on the
#         backend URL, and the owner panel no longer links to /docs at all.
#
# The backend's address is wired by Render itself (fromService below), not
# typed in here. A hardcoded URL is the same value living in two places, and
# it goes stale the first time a service is recreated and gets a new name —
# which is exactly what a fresh blueprint apply does.
services:
  - type: web
    name: myna
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/food/health
    envVars:
      - key: MYNA_DATABASE_URL
        fromDatabase:
          name: myna-db
          property: connectionString
      # The front end is a different origin, so CORS is load-bearing here.
      # Open because there is no auth to protect; tighten to the myna-app URL
      # once that matters.
      - key: MYNA_ALLOWED_ORIGINS
        value: "*"
      # ---- Set these in the Render dashboard (Environment tab) after deploy ----
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional — web search grounding for trending / weather suggestions.
      # Falls back to free/keyless DuckDuckGo without it.
      - key: EXA_API_KEY
        sync: false
      # Photo storage. Without these, a kept photo is written to this
      # instance's disk — which Render wipes on every deploy, so the picture on
      # the card 404s a day later. Cloudinary's free tier is enough.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: myna-app
    runtime: static
    autoDeploy: true
    # No bundler — app/static is plain HTML/JS. This only bakes the backend's
    # origin into config.js, which is the single thing the pages need to know.
    buildCommand: printf 'window.MYNA_API_BASE = "https://%s";' "$MYNA_BACKEND_HOST" > app/static/config.js
    staticPublishPath: ./app/static
    envVars:
      # Resolved by Render from the backend service, so it cannot drift and
      # survives the backend being recreated under a new name. `host` is the
      # bare hostname; the scheme is added in the build command above.
      - key: MYNA_BACKEND_HOST
        fromService:
          type: web
          name: myna
          property: host
    routes:
      - type: rewrite
        source: /admin
        destination: /admin.html

databases:
  - name: myna-db
    plan: free
    databaseName: myna
    user: myna
