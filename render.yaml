# Render blueprint — Myna as one service plus PostgreSQL.
# Free-plan friendly: no persistent disk needed.
# Docs: https://render.com/docs/blueprint-spec
#
# ONE service on purpose. There used to be a second, static-site service
# publishing app/static, to dodge the free backend's ~30 s cold start. It cost
# more than it saved:
#
#   - /docs and /api/* returned 404 there, because a static host has neither
#   - it served whatever HTML was last built, so it went stale silently while
#     the backend was already up to date — the app looked un-deployed when it
#     wasn't
#   - the pages had to learn the backend's URL through a generated config.js,
#     and any drift in that value broke every request while both services
#     still reported healthy
#
# Now one URL answers everything: the app at /, the owner panel at /admin, the
# API at /api/*, the docs at /docs. The cold start is a real cost, but a
# deployment nobody can reason about is a worse one during a pilot.
services:
  - type: web
    name: myna
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: MYNA_DATABASE_URL
        fromDatabase:
          name: myna-db
          property: connectionString
      # Same-origin now that there's one service, so CORS isn't load-bearing.
      # Left open because there's no auth to protect anyway.
      - key: MYNA_ALLOWED_ORIGINS
        value: "*"
      # ---- Set these in the Render dashboard (Environment tab) after deploy ----
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional — web search grounding for trending / weather suggestions.
      # Falls back to free/keyless DuckDuckGo without it.
      - key: EXA_API_KEY
        sync: false

databases:
  - name: myna-db
    plan: free
    databaseName: myna
    user: myna
