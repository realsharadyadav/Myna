<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myna — Find it nearby</title>
<link rel="icon" type="image/svg+xml" href="/myna-logo.svg">
<script src="/config.js"></script>
<style>
  :root {
    --bg-0: #f4f7fb;
    --bg-1: #e9eef7;
    --glass: rgba(255,255,255,.72);
    --glass-border: rgba(255,255,255,.9);
    --card-shadow: 0 8px 32px rgba(30,42,80,.10), 0 2px 8px rgba(30,42,80,.06);
    --text: #182033;
    --text-soft: #5a6b8c;
    --text-faint: #8a97b3;
    --input-bg: rgba(255,255,255,.85);
    --input-border: rgba(120,140,180,.25);
    --accent: #00b3a4;
    --accent-2: #5b7cfa;
    --btn-text: #ffffff;
    --brand: linear-gradient(135deg,#00b3a4,#5b7cfa);
    --msg: #8a97b3;
  }
  [data-theme="dark"] {
    --bg-0: #0b1020;
    --bg-1: #101830;
    --glass: rgba(23,32,60,.66);
    --glass-border: rgba(120,150,220,.16);
    --card-shadow: 0 8px 32px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
    --text: #e7ecf6;
    --text-soft: #a7b4cc;
    --text-faint: #7c8aa8;
    --input-bg: rgba(10,16,34,.6);
    --input-border: rgba(120,150,220,.22);
    --accent: #00d4c0;
    --accent-2: #7c99ff;
    --brand: linear-gradient(135deg,#00d4c0,#7c99ff);
    --msg: #7c8aa8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 55%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1));
    color: var(--text);
    min-height: 100vh;
    transition: background .4s ease, color .4s ease;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    background: color-mix(in srgb, var(--bg-0) 72%, transparent);
    border-bottom: 1px solid var(--glass-border);
    padding: 14px 20px;
  }
  .header-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 42px; height: 42px; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 50%, transparent)); }
  .brand h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em;
    background: var(--brand); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .theme-toggle {
    width: 44px; height: 44px; border-radius: 14px; cursor: pointer; border: 1px solid var(--glass-border);
    background: var(--glass); color: var(--text); font-size: 1.15rem; display: grid; place-items: center;
    box-shadow: var(--card-shadow); transition: transform .15s ease, background .3s ease;
  }
  .theme-toggle:hover { transform: translateY(-2px) scale(1.05); }
  .theme-toggle:active { transform: scale(.95); }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }

  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 14px;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: var(--card-shadow);
    transition: background .4s ease, border-color .4s ease;
  }
  .controls label { display: block; font-size: .78rem; font-weight: 700; margin: 12px 0 6px; color: var(--text-soft); text-transform: uppercase; letter-spacing: .06em; }
  .controls input[type=text] {
    width: 100%; padding: 15px 16px; border: 1.5px solid var(--input-border); border-radius: 16px; font-size: 1rem;
    background: var(--input-bg); color: var(--text); transition: border-color .2s ease, box-shadow .2s ease;
  }
  .controls input[type=text]::placeholder { color: var(--text-faint); }
  .controls input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  button {
    width: 100%; padding: 15px; border: none; border-radius: 16px; font-size: 1rem; font-weight: 700; cursor: pointer;
    background: var(--brand); color: var(--btn-text); margin-top: 16px;
    box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--accent) 55%, transparent);
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -10px color-mix(in srgb, var(--accent) 65%, transparent); }
  button:active { transform: translateY(0) scale(.98); }
  button:disabled { opacity: .55; transform: none; box-shadow: none; }

  .result { display: flex; gap: 14px; align-items: center; animation: rise .35s ease backwards; }
  .result:nth-child(2) { animation-delay: .03s; }
  .result img { width: 72px; height: 72px; object-fit: cover; border-radius: 18px; background: var(--input-bg); flex-shrink: 0; }
  .result .info { flex: 1; min-width: 0; }
  .result .item { font-weight: 700; font-size: 1.02rem; }
  .result .cat { font-size: .74rem; color: var(--text-faint); margin-top: 1px; }
  .result .shop { font-size: .9rem; margin-top: 6px; font-weight: 600; }
  .result .addr { font-size: .78rem; color: var(--text-soft); margin-top: 3px; line-height: 1.4; }
  .dist {
    background: var(--brand); color: #fff; font-weight: 700; font-size: .8rem; padding: 7px 12px; border-radius: 999px;
    white-space: nowrap; box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--accent) 50%, transparent);
  }
  .msg { text-align: center; color: var(--msg); padding: 28px 0; font-size: .95rem; }
  .pipeline { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:6px; font-size:.86rem; color:var(--text-soft); }
  .pipeline .crumb { color:var(--text-faint); }
  .chip {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--accent); font-weight:700; font-size:.78rem;
    padding:5px 11px; border-radius:999px;
  }
  .loader { width:16px; height:16px; border:2px solid var(--input-border); border-top-color:var(--accent); border-radius:50%; display:inline-block; animation:spin 1s linear infinite; vertical-align:middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .coverage { font-size:.8rem; font-weight:800; color:#fff; background:var(--brand); padding:6px 12px; border-radius:999px; white-space:nowrap; }
  .badge { font-size:.68rem; font-weight:700; color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .missing { font-size:.8rem; color:var(--text-faint); margin-top:10px; padding-top:10px; border-top:1px dashed var(--input-border); }
  .shop-group { animation: rise .35s ease backwards; }
  .shop-head { display:flex; align-items:flex-start; gap:10px; }
  .shop-head .sinfo { flex:1; min-width:0; }
  .shop-head .sname { font-weight:800; font-size:1.05rem; }
  .shop-head .skeeper { font-size:.82rem; color:var(--text-soft); margin-top:2px; }
  .shop-head .saddr { font-size:.78rem; color:var(--text-soft); margin-top:4px; line-height:1.4; }
  .shop-items { margin-top:12px; }
  .shop-items .sitem { display:flex; gap:12px; align-items:center; padding:9px 0; }
  .shop-items .sitem + .sitem { border-top:1px solid var(--input-border); }
  .shop-items img { width:52px; height:52px; object-fit:cover; border-radius:14px; background:var(--input-bg); flex-shrink:0; }
  .shop-items .iinfo { flex:1; min-width:0; }
  .shop-items .iname { font-weight:700; font-size:.94rem; }
  .shop-items .icat { font-size:.72rem; color:var(--text-faint); margin-top:1px; }
  .link { text-align: center; margin: 22px 0 0; font-size: .86rem; color: var(--text-soft); }
  .link a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .link a:hover { text-decoration: underline; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 480px) {
    .brand h1 { font-size: 1.15rem; }
    .card { border-radius: 18px; padding: 16px; }
  }
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="/myna-logo.svg" alt="Myna AI">
        <h1>Myna</h1>
      </div>
      <button class="theme-toggle" id="themeBtn" title="Toggle theme" aria-label="Toggle dark/light mode"></button>
    </div>
  </header>
  <main>
    <div class="card controls">
      <label for="q">What are you looking for?</label>
      <input type="text" id="q" placeholder="e.g. salt milk and mango, doodh 1L…" onkeydown="if(event.key==='Enter')doSearch()">
      <button id="searchBtn" onclick="doSearch()">Search nearby</button>
    </div>
    <div id="results"></div>
    <div class="link">Shopkeeper? <a href="/shopkeeper">List your shop →</a></div>
  </main>
<script>
const API = window.MYNA_API_BASE || '';
(function () {
  const root = document.documentElement;
  const saved = localStorage.getItem('myna_theme');
  const prefers = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  root.setAttribute('data-theme', saved || prefers);
  const btn = document.getElementById('themeBtn');
  function render() {
    const dark = root.getAttribute('data-theme') === 'dark';
    btn.textContent = dark ? '☀️' : '🌙';
  }
  btn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('myna_theme', next);
    render();
  });
  render();
})();

let userLoc = null;

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    p => { userLoc = { lat: p.coords.latitude, long: p.coords.longitude }; },
    () => { document.getElementById('results').innerHTML = '<div class="msg">⚠️ Location access denied. Search will use default location (Mumbai).</div>'; }
  );
} else {
  document.getElementById('results').innerHTML = '<div class="msg">⚠️ Location not available (needs HTTPS). Search will use default location (Mumbai).</div>';
}

const PLACEHOLDER_IMG = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22/>';

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const loc = userLoc || { lat: 19.076, long: 72.8777 }; // fallback: Mumbai
  const btn = document.getElementById('searchBtn');
  const box = document.getElementById('results');
  btn.disabled = true; btn.textContent = 'Searching…';
  box.innerHTML = '<div class="msg"><span class="loader"></span>&nbsp; Understanding your list…</div>';
  try {
    const res = await fetch(`${API}/api/search/shops?q=${encodeURIComponent(q)}&lat=${loc.lat}&long=${loc.long}`);
    const data = await res.json();
    const chips = (data.items || []).map(i => `<span class="chip">${esc(i)}</span>`).join('<span class="crumb">·</span>');
    const agentTag = data.method === 'concept-llm-web' ? '🌐 AI + web parsed'
      : data.method.startsWith('llm') || data.method.startsWith('concept-llm') ? '🤖 AI parsed'
      : '⚡ smart parse';
    let html = `<div class="card"><div class="pipeline">Found <b>&nbsp;${(data.items||[]).length} item(s)&nbsp;</b> ${chips} <span class="crumb">(${agentTag})</span></div></div>`;
    if (!data.shops || !data.shops.length) {
      html += '<div class="msg">No shops found with “' + esc(q) + '”.</div>';
    } else {
      html += data.shops.map(s => {
        const matchedTerms = new Set(s.items.map(i => i.matched_term));
        const missing = (data.items || []).filter(i => !matchedTerms.has(i));
        return `
        <div class="card shop-group">
          <div class="shop-head">
            <div class="sinfo">
              <div class="sname">🏪 ${esc(s.shop_name)}</div>
              ${s.shopkeeper ? `<div class="skeeper">👤 ${esc(s.shopkeeper)}</div>` : ''}
              <div class="saddr">${esc(s.address)}${s.phone ? ' · 📞 ' + esc(s.phone) : ''}</div>
            </div>
            <div class="coverage">${s.coverage_count}/${s.coverage_total} items</div>
          </div>
          <div class="shop-items">
            ${s.items.map(r => `
              <div class="sitem">
                <img src="${r.item_photo_url ? API + r.item_photo_url : PLACEHOLDER_IMG}" alt="">
                <div class="iinfo">
                  <div class="iname">${esc(r.item_name)}${r.matched_term ? `<span class="badge">${esc(r.matched_term)}</span>` : ''}</div>
                  ${r.item_category ? `<div class="icat">${esc(r.item_category)}</div>` : ''}
                </div>
                <div class="dist">${s.distance_km} km</div>
              </div>`).join('')}
          </div>
          ${missing.length ? `<div class="missing">⚠️ Not here: ${missing.map(esc).join(', ')}</div>` : ''}
        </div>`;
      }).join('');
    }
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<div class="msg">Search failed. Please try again.</div>';
  }
  btn.disabled = false; btn.textContent = 'Search nearby';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
</script>
</body>
</html>
