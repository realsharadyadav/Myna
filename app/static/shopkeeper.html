<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myna — Shopkeeper</title>
<link rel="icon" type="image/svg+xml" href="/myna-logo.svg">
<script src="/config.js"></script>
<style>
  :root {
    --bg-0: #f4f7fb;
    --bg-1: #e9eef7;
    --glass: rgba(255,255,255,.72);
    --glass-border: rgba(255,255,255,.9);
    --card-shadow: 0 8px 32px rgba(30,42,80,.10), 0 2px 8px rgba(30,42,80,.06);
    --text: #182033;
    --text-soft: #5a6b8c;
    --text-faint: #8a97b3;
    --input-bg: rgba(255,255,255,.85);
    --input-border: rgba(120,140,180,.25);
    --accent: #00b3a4;
    --accent-2: #5b7cfa;
    --btn-text: #ffffff;
    --brand: linear-gradient(135deg,#00b3a4,#5b7cfa);
    --msg: #8a97b3;
    --danger: #e5484d;
    --danger-bg: rgba(229,72,77,.12);
    --divider: rgba(120,140,180,.18);
  }
  [data-theme="dark"] {
    --bg-0: #0b1020;
    --bg-1: #101830;
    --glass: rgba(23,32,60,.66);
    --glass-border: rgba(120,150,220,.16);
    --card-shadow: 0 8px 32px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
    --text: #e7ecf6;
    --text-soft: #a7b4cc;
    --text-faint: #7c8aa8;
    --input-bg: rgba(10,16,34,.6);
    --input-border: rgba(120,150,220,.22);
    --accent: #00d4c0;
    --accent-2: #7c99ff;
    --brand: linear-gradient(135deg,#00d4c0,#7c99ff);
    --msg: #7c8aa8;
    --danger: #ff6b6b;
    --danger-bg: rgba(255,107,107,.14);
    --divider: rgba(120,150,220,.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 55%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1));
    color: var(--text);
    min-height: 100vh;
    transition: background .4s ease, color .4s ease;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    background: color-mix(in srgb, var(--bg-0) 72%, transparent);
    border-bottom: 1px solid var(--glass-border);
    padding: 14px 20px;
  }
  .header-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 42px; height: 42px; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 50%, transparent)); }
  .brand h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em;
    background: var(--brand); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .theme-toggle {
    width: 44px; height: 44px; border-radius: 14px; cursor: pointer; border: 1px solid var(--glass-border);
    background: var(--glass); color: var(--text); font-size: 1.15rem; display: grid; place-items: center;
    box-shadow: var(--card-shadow); transition: transform .15s ease, background .3s ease;
  }
  .theme-toggle:hover { transform: translateY(-2px) scale(1.05); }
  .theme-toggle:active { transform: scale(.95); }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }

  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 14px;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: var(--card-shadow);
    transition: background .4s ease, border-color .4s ease;
    animation: rise .35s ease backwards;
  }
  #itemsCard { animation-delay: .06s; }
  #listCard { animation-delay: .12s; }
  h2 { font-size: 1.02rem; margin-bottom: 6px; font-weight: 800; letter-spacing: -.01em; }
  label { display: block; font-size: .78rem; font-weight: 700; margin: 14px 0 6px; color: var(--text-soft); text-transform: uppercase; letter-spacing: .06em; }
  input[type=text], input[type=tel] {
    width: 100%; padding: 13px 14px; border: 1.5px solid var(--input-border); border-radius: 14px; font-size: 1rem;
    background: var(--input-bg); color: var(--text); transition: border-color .2s ease, box-shadow .2s ease;
  }
  input[type=text]::placeholder, input[type=tel]::placeholder { color: var(--text-faint); }
  input[type=text]:focus, input[type=tel]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  input[type=file] { width: 100%; margin-top: 4px; font-size: .85rem; color: var(--text-soft); }
  input[type=file]::file-selector-button {
    padding: 10px 16px; border: 1.5px solid var(--input-border); border-radius: 12px; background: var(--input-bg);
    color: var(--text); font-weight: 600; cursor: pointer; margin-right: 10px; transition: border-color .2s ease;
  }
  input[type=file]::file-selector-button:hover { border-color: var(--accent); }
  button {
    padding: 13px; border: none; border-radius: 14px; font-size: .95rem; font-weight: 700; cursor: pointer; margin-top: 12px; width: 100%;
    background: var(--brand); color: var(--btn-text);
    box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--accent) 55%, transparent);
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0) scale(.98); }
  button.secondary { background: transparent; color: var(--accent); border: 1.5px solid color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: none; }
  button.secondary:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  button.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid transparent; padding: 7px 12px; width: auto; margin: 0; font-size: .78rem; box-shadow: none; }
  button.danger:hover { border-color: var(--danger); }
  button.small { padding: 7px 12px; width: auto; margin: 0; font-size: .78rem; }
  button:disabled { opacity: .55; transform: none; box-shadow: none; }
  .hint { font-size: .78rem; color: var(--text-soft); margin-top: 8px; line-height: 1.45; }
  .item-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--divider); }
  .item-row:last-child { border-bottom: none; }
  .item-row img { width: 52px; height: 52px; object-fit: cover; border-radius: 14px; background: var(--input-bg); flex-shrink: 0; }
  .item-row .info { flex: 1; min-width: 0; }
  .item-row .name { font-weight: 700; font-size: .95rem; }
  .item-row .cat { font-size: .75rem; color: var(--text-faint); margin-top: 1px; }
  .msg { text-align: center; color: var(--msg); padding: 18px 0; font-size: .9rem; }
  .hidden { display: none; }
  .link { text-align: center; margin: 22px 0 0; font-size: .86rem; color: var(--text-soft); }
  .link a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .link a:hover { text-decoration: underline; }
  .badge { display: inline-block; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 480px) { .brand h1 { font-size: 1.05rem; } .card { border-radius: 18px; padding: 16px; } }

  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(1200px 600px at 15% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 55%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1));
    transition: opacity .45s ease;
  }
  #splash.splash-hide { opacity: 0; pointer-events: none; }
  .splash-inner { text-align: center; padding: 0 24px; }
  .splash-inner img { width: 64px; height: 64px; filter: drop-shadow(0 0 16px color-mix(in srgb, var(--accent) 55%, transparent)); }
  .splash-inner h1 {
    margin-top: 14px; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em;
    background: var(--brand); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .splash-bar { width: 220px; height: 4px; border-radius: 999px; background: var(--input-border); margin: 22px auto 16px; overflow: hidden; }
  .splash-bar-fill { height: 100%; width: 8%; border-radius: 999px; background: var(--brand); transition: width .4s ease; }
  .splash-status { font-size: .92rem; font-weight: 600; color: var(--text-soft); }
  .splash-tagline { font-size: .8rem; color: var(--text-faint); margin-top: 6px; }
</style>
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <img src="/myna-logo.svg" alt="Myna">
      <h1>Myna</h1>
      <div class="splash-bar"><div class="splash-bar-fill" id="splashFill"></div></div>
      <p class="splash-status" id="splashStatus">Waking up services…</p>
      <p class="splash-tagline">Get your shop listed, fast.</p>
    </div>
  </div>
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="/myna-logo.svg" alt="Myna AI">
        <h1>Myna — Shopkeeper</h1>
      </div>
      <button class="theme-toggle" id="themeBtn" title="Toggle theme" aria-label="Toggle dark/light mode"></button>
    </div>
  </header>
<main>
  <!-- STEP 1: Onboarding -->
  <div id="onboardCard" class="card">
    <h2>Step 1 · Register your shop</h2>
    <label>1. Photo of your shop signage (we'll read the name)</label>
    <input type="file" id="signPhoto" accept="image/*" capture="environment">
    <button class="secondary" id="readNameBtn" onclick="readSignage()">📷 Read name from photo</button>
    <div class="hint" id="aiHint"></div>

    <label for="shopName">Shop name</label>
    <input type="text" id="shopName" placeholder="e.g. Sharma General Store">

    <label for="shopkeeper">Your name (shopkeeper)</label>
    <input type="text" id="shopkeeper" placeholder="e.g. Rakesh Sharma">

    <label for="shopPhone">Phone (optional)</label>
    <input type="tel" id="shopPhone" placeholder="e.g. 98123 45678">

    <label>2. Location</label>
    <button class="secondary" id="gpsBtn" onclick="captureGps()">📍 Capture my location</button>
    <div class="hint" id="gpsHint"></div>

    <label for="shopAddr">Address (auto-filled, editable)</label>
    <input type="text" id="shopAddr" placeholder="Auto-filled from GPS after capture">

    <button id="saveShopBtn" onclick="saveShop()" disabled>Save my shop</button>
  </div>

  <!-- STEP 2: Items -->
  <div id="itemsCard" class="card hidden">
    <h2>Step 2 · Add items — <span class="badge" id="shopBadge"></span></h2>
    <label>Photo of the item</label>
    <input type="file" id="itemPhoto" accept="image/*" capture="environment">
    <button class="secondary" id="suggestBtn" onclick="suggestItem()">✨ Suggest name from photo</button>
    <div class="hint" id="itemAiHint"></div>

    <label for="itemName">Item name</label>
    <input type="text" id="itemName" placeholder="e.g. Parle-G Gold 100g">

    <label for="itemCat">Category</label>
    <input type="text" id="itemCat" placeholder="e.g. Snacks">

    <button id="addItemBtn" onclick="addItem()">Add item</button>
  </div>

  <div id="listCard" class="card hidden">
    <h2>Your items</h2>
    <div id="itemList"></div>
  </div>

  <div class="link">Looking for something? <a href="/">Search shops →</a></div>
</main>
<script>
const API = window.MYNA_API_BASE || '';

(function () {
  const splash = document.getElementById('splash');
  const fill = document.getElementById('splashFill');
  const status = document.getElementById('splashStatus');
  let progress = 8;
  fill.style.width = progress + '%';
  const tick = setInterval(() => {
    progress = Math.min(progress + (100 - progress) * 0.12, 92);
    fill.style.width = progress + '%';
  }, 400);

  const messages = ['Waking up services…', 'Free-tier backend can take up to a minute…', 'Almost there…'];
  let mi = 0;
  const msgTimer = setInterval(() => {
    mi = Math.min(mi + 1, messages.length - 1);
    status.textContent = messages[mi];
  }, 7000);

  function hideSplash(finalMessage, delay) {
    clearInterval(tick);
    clearInterval(msgTimer);
    fill.style.width = '100%';
    status.textContent = finalMessage;
    setTimeout(() => {
      splash.classList.add('splash-hide');
      setTimeout(() => splash.remove(), 500);
    }, delay);
  }

  async function ping() {
    try {
      const res = await fetch(`${API}/`, { cache: 'no-store' });
      return res.ok;
    } catch (e) {
      return false;
    }
  }

  (async function waitForBackend() {
    const deadline = Date.now() + 90000;
    while (Date.now() < deadline) {
      if (await ping()) { hideSplash('Ready', 250); return; }
      await new Promise(r => setTimeout(r, 2000));
    }
    hideSplash('Taking longer than usual — you can still continue.', 900);
  })();
})();

(function () {
  const root = document.documentElement;
  const saved = localStorage.getItem('myna_theme');
  const prefers = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  root.setAttribute('data-theme', saved || prefers);
  const btn = document.getElementById('themeBtn');
  function render() {
    btn.textContent = root.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  btn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('myna_theme', next);
    render();
  });
  render();
})();

let shopId = localStorage.getItem('myna_shop_id');
let pendingItemPhotoUrl = '';

if (shopId) loadShop(shopId);

async function loadShop(id) {
  try {
    const res = await fetch(`${API}/api/shops/${id}`);
    if (!res.ok) throw 0;
    const shop = await res.json();
    shopId = shop.shop_id;
    document.getElementById('shopBadge').textContent = shop.name;
    document.getElementById('onboardCard').classList.add('hidden');
    document.getElementById('itemsCard').classList.remove('hidden');
    document.getElementById('listCard').classList.remove('hidden');
    loadItems();
  } catch { localStorage.removeItem('myna_shop_id'); }
}

async function readSignage() {
  const f = document.getElementById('signPhoto').files[0];
  if (!f) { alert('Please take/select a signage photo first'); return; }
  const hint = document.getElementById('aiHint');
  hint.textContent = 'Reading name…';
  const fd = new FormData(); fd.append('photo', f);
  try {
    const res = await fetch(API + '/api/shops/onboard/photo', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.suggestion) {
      document.getElementById('shopName').value = data.suggestion;
      hint.textContent = '✓ Name read from photo — edit if needed.';
    } else {
      hint.textContent = 'Could not read name (AI key not set or unreadable). Please type it.';
    }
  } catch { hint.textContent = 'Could not read name. Please type it.'; }
  checkReady();
}

function captureGps() {
  const hint = document.getElementById('gpsHint');
  hint.textContent = 'Getting GPS…';
  navigator.geolocation.getCurrentPosition(async p => {
    window._gps = { lat: p.coords.latitude, long: p.coords.longitude };
    hint.textContent = `✓ ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} — fetching address…`;
    try {
      const res = await fetch(`${API}/api/shops/geocode/reverse?lat=${_gps.lat}&long=${_gps.long}`);
      const data = await res.json();
      if (data.address) document.getElementById('shopAddr').value = data.address;
    } catch {}
    hint.textContent = `✓ ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;
    checkReady();
  }, () => { hint.textContent = 'Location denied. Enable GPS and retry.'; });
}

function checkReady() {
  const name = document.getElementById('shopName').value.trim();
  document.getElementById('saveShopBtn').disabled = !(name && window._gps);
}
document.getElementById('shopName').addEventListener('input', checkReady);

async function saveShop() {
  const btn = document.getElementById('saveShopBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const body = {
    name: document.getElementById('shopName').value.trim(),
    shopkeeper: document.getElementById('shopkeeper').value.trim(),
    lat: window._gps.lat,
    long: window._gps.long,
    address: document.getElementById('shopAddr').value.trim(),
    phone: document.getElementById('shopPhone').value.trim(),
  };
  try {
    const res = await fetch(API + '/api/shops', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const shop = await res.json();
    const signFile = document.getElementById('signPhoto').files[0];
    if (signFile) {
      const fd = new FormData(); fd.append('photo', signFile);
      await fetch(`${API}/api/shops/${shop.shop_id}/photo`, { method: 'POST', body: fd });
    }
    localStorage.setItem('myna_shop_id', shop.shop_id);
    loadShop(shop.shop_id);
  } catch { alert('Save failed. Try again.'); btn.disabled = false; btn.textContent = 'Save my shop'; }
}

async function suggestItem() {
  const f = document.getElementById('itemPhoto').files[0];
  if (!f) { alert('Please take/select an item photo first'); return; }
  const hint = document.getElementById('itemAiHint');
  hint.textContent = 'Identifying item…';
  const fd = new FormData(); fd.append('photo', f);
  try {
    const res = await fetch(`${API}/api/shops/${shopId}/items/suggest`, { method: 'POST', body: fd });
    const data = await res.json();
    pendingItemPhotoUrl = data.photo_url || '';
    if (data.name) document.getElementById('itemName').value = data.name;
    if (data.category) document.getElementById('itemCat').value = data.category;
    hint.textContent = data.name ? '✓ Suggestion filled in — edit if needed, then Add.' : 'No suggestion (AI key not set). Type the name and Add.';
  } catch { hint.textContent = 'Suggestion failed. Type the name and Add.'; }
}

async function addItem() {
  const name = document.getElementById('itemName').value.trim();
  if (!name) { alert('Item name is required'); return; }
  const btn = document.getElementById('addItemBtn');
  btn.disabled = true;
  const fd = new FormData();
  fd.append('name', name);
  fd.append('category', document.getElementById('itemCat').value.trim());
  const f = document.getElementById('itemPhoto').files[0];
  if (f) fd.append('photo', f);
  try {
    await fetch(`${API}/api/shops/${shopId}/items`, { method: 'POST', body: fd });
    document.getElementById('itemName').value = '';
    document.getElementById('itemCat').value = '';
    document.getElementById('itemPhoto').value = '';
    document.getElementById('itemAiHint').textContent = '';
    loadItems();
  } catch { alert('Add failed. Try again.'); }
  btn.disabled = false;
}

async function loadItems() {
  const res = await fetch(`${API}/api/shops/${shopId}/items`);
  const items = await res.json();
  const list = document.getElementById('itemList');
  if (!items.length) { list.innerHTML = '<div class="msg">No items yet. Add your first one above.</div>'; return; }
  list.innerHTML = items.map(i => `
    <div class="item-row">
      ${i.photo_url ? `<img src="${API}${i.photo_url}" alt="">` : ''}
      <div class="info">
        <div class="name" id="n${i.item_id}">${esc(i.name)}</div>
        <div class="cat">${esc(i.category)}</div>
      </div>
      <button class="small secondary" onclick="editItem(${i.item_id})">Edit</button>
      <button class="danger" onclick="deleteItem(${i.item_id})">Delete</button>
    </div>`).join('');
}

async function editItem(id) {
  const el = document.getElementById('n' + id);
  const newName = prompt('Item name:', el.textContent);
  if (newName === null || !newName.trim()) return;
  const newCat = prompt('Category:', '');
  await fetch(`${API}/api/shops/${shopId}/items/${id}`, {
    method: 'PATCH', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name: newName.trim(), category: newCat || '' })
  });
  loadItems();
}

async function deleteItem(id) {
  if (!confirm('Delete this item?')) return;
  await fetch(`${API}/api/shops/${shopId}/items/${id}`, { method: 'DELETE' });
  loadItems();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
</script>
</body>
</html>
