<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="vPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4c0"/>
      <stop offset="100%" stop-color="#009d94"/>
    </linearGradient>
  </defs>

  <!-- Location pin -->
  <path d="M60,62
    C74,62 86,73.5 86,87.5
    C86,98 74,111 60,120
    C46,111 34,98 34,87.5
    C34,73.5 46,62 60,62 Z" fill="url(#vPin)"/>
  <!-- Pin hole -->
  <circle cx="60" cy="84" r="8" fill="#ffffff"/>

  <!-- Myna bird perched on the pin -->
  <g>
    <!-- Tail -->
    <path d="M42,48 C30,48 18,52 13,64 C20,63 28,59 36,55 Z" fill="#1f2a30"/>
    <!-- Body -->
    <ellipse cx="50" cy="54" rx="15" ry="11" fill="#1f2a30"/>
    <!-- Head -->
    <circle cx="65" cy="44" r="10" fill="#1f2a30"/>
    <!-- Crest -->
    <path d="M61,36 C61,30 65,28 67,33 Z" fill="#1f2a30"/>
    <!-- Beak -->
    <path d="M74,40 L86,45 L74,48 Z" fill="#ffb020"/>
    <!-- Eye -->
    <circle cx="69" cy="42" r="2" fill="#ffffff"/>
    <!-- Legs -->
    <line x1="47" y1="63" x2="44" y2="67" stroke="#1f2a30" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="53" y1="63" x2="56" y2="67" stroke="#1f2a30" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
